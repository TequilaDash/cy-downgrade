name: Build Cyanide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Public Submodules
        run: |
          git config submodule.Cyanide/tweaks/private.update none
          git submodule update --init --recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make build script executable
        run: chmod +x ./scripts/build.sh

      - name: Compile Cyanide (Unsigned)
        run: ./scripts/build.sh

      # Artifact storage on this account is full, so the IPA goes to a Release
      # instead — releases have their own quota and are directly downloadable.
      - name: Publish IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/Cyanide-*.ipa \
            --title "Cyanide $TAG" \
            --notes "Unsigned IPA built from ${GITHUB_SHA}." \
            --latest
          echo "release: $TAG"
